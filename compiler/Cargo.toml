[package]
name = "okay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
description = "OKAY\\n, the Cyborg compiler"
publish = false

[[bin]]
name = "okay"
path = "src/main.rs"

[dependencies]
lyftar = { git = "https://github.com/Soclets/Lyftar" }
unicode-segmentation = "1"
unicode-width = "0.2"
num-bigint = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
# Verus sets this cfg when it reads the proven checks (rule 13); plain rustc never does.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
